<!--
  ============================================================
  index.html — главная страница проекта.
  Файл называется index.html, потому что веб-сервер по умолчанию
  отдаёт именно его, когда пользователь заходит на корень сайта.
  ============================================================
-->

<!--
  <!DOCTYPE html> — объявление типа документа (Document Type Declaration).
  Сообщает браузеру, что это HTML5-документ.
  Переключает браузер в стандартный режим (standards mode).
  Без него браузер уходит в quirks mode, где имитируется поведение
  старых браузеров и современная вёрстка может ломаться.
  Должен быть первой строкой документа.
-->
<!DOCTYPE html>

<!--
  <html> — корневой элемент документа. Все остальные элементы — его потомки.
  Атрибут lang="ru" указывает язык содержимого страницы.
  Это влияет на:
    - произношение в скринридерах (программах чтения с экрана);
    - правила переноса слов;
    - SEO (поисковые системы понимают язык страницы);
    - автоматический перевод в браузере.
  Значение должно быть валидным BCP 47 language tag (ru, en, en-US и т.д.).
-->
<html lang="ru">

<!--
  <head> — контейнер для метаданных (информации о странице).
  Содержимое <head> не отображается в теле страницы.
  Здесь размещают: <meta>, <title>, <link>, <style>, <script>.
-->

<head>

  <!--
      <meta charset="UTF-8"> — указывает кодировку документа.
      UTF-8 — универсальная кодировка, поддерживающая все языки мира,
      включая кириллицу.
      Должен стоять как можно раньше — в первых 1024 байтах документа,
      иначе браузер может неправильно определить кодировку
      и показать «кракозябры» вместо русского текста.
  -->
  <meta charset="UTF-8">

  <!--
      <meta name="viewport" ...> — управляет областью просмотра (viewport).
      Без этого тега мобильные браузеры отображают страницу
      в виртуальном окне шириной ~980px и затем масштабируют её.

      width=device-width  — ширина области просмотра равна ширине экрана.
      initial-scale=1.0   — начальный масштаб 100%.

      Это обязательный тег для адаптивной вёрстки.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
      <title> — заголовок страницы.
      Отображается:
        - на вкладке браузера;
        - в закладках;
        - в результатах поиска.
      Важно: содержит только текст. HTML-теги внутри <title> игнорируются.
  -->
  <title>Мой первый проект</title>

</head>
<!-- Конец секции <head> -->

<!--
  <body> — тело документа. Содержит всё, что видно пользователю
  на странице: текст, изображения, ссылки, формы и т.д.
  В документе может быть только один <body>.
-->

<body>

  <!--
      <h1> — заголовок первого уровня.
      Самый важный заголовок на странице.

      Иерархия заголовков: <h1> (главный) → <h2> → <h3> → <h4> → <h5> → <h6>.
      На одной странице обычно один <h1>.
      Заголовки важны для SEO и доступности (скринридеры используют их
      для навигации по странице).
  -->
  <h1>Заголовок</h1>

</body>
<!-- Конец секции <body> -->

</html>
<!-- Конец корневого элемента <html> -->
